<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrilloSupreme Cleaning - Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        :root {
            --bg-color: #fdf2f2;      /* Rosa muy pálido, casi blanco */
            --primary-pink: #d1a3a9;  /* Rosa viejo para iconos y acentos */
            --accent-pink: #ecc7cd;   /* Rosa suave para botones */
            --text-dark: #4a3f3f;     /* Gris oscuro cálido para texto */
            --white: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px 0;
        }

        .container-card {
            max-width: 450px;
            width: 90%;
            text-align: center;
            background: rgba(255, 255, 255, 0.3); /* Contenedor sutil */
            border-radius: 30px;
            padding: 2rem 1.5rem;
        }

        /* Avatar */
        .profile-img {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 50%;
            border: 6px solid var(--white);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            margin-bottom: 1.5rem;
        }

        .brand-logo {
            max-width: 240px;
        }

        /* Secciones */
        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 1.2rem;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            width: 50%;
            height: 2px;
            background: var(--accent-pink);
            position: absolute;
            bottom: -5px;
            left: 25%;
        }

        /* Tarjetas de Servicio - Mejora de contraste */
        .service-card {
            background: var(--white);
            border-radius: 15px;
            padding: 12px 8px;
            height: 100%;
            border: 1px solid rgba(209, 163, 169, 0.1);
            transition: transform 0.3s ease;
        }

        .service-card i {
            font-size: 1.5rem;
            color: var(--primary-pink);
            margin-bottom: 5px;
            display: block;
        }

        .service-card p {
            font-size: 0.75rem;
            font-weight: 600;
            margin: 0;
            line-height: 1.2;
            color: var(--text-dark);
        }

        /* Frecuencia */
        .badge-custom {
            background-color: var(--white);
            color: var(--primary-pink);
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid var(--accent-pink);
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        /* Botones de Contacto - Mejor contraste */
        .btn-custom {
            background-color: var(--accent-pink);
            color: var(--text-dark);
            border-radius: 50px;
            padding: 14px 20px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .btn-custom i {
            font-size: 1.2rem;
            margin-right: 10px;
        }

        .btn-custom:hover {
            background-color: var(--primary-pink);
            color: var(--white);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(209, 163, 169, 0.4);
        }
        
        /* Icono flotante */
        .click-icon {
            width: 70px;
            position: fixed;
            bottom: 20px;
            right: 20px;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="container-card">
        
        <img src="./assets/img/LogoB.png" alt="Profile" class="profile-img">

        <div class="mb-2 text-center">
            <img src="./assets/img/LogoBrilloSup.png" alt="BrilloSupreme Cleaning" class="brand-logo img-fluid">
        </div>

        <div class="services-section mb-5">
            <h3 class="section-title">Our Services</h3>
            <div class="row g-3 justify-content-center mt-2">
                <div class="col-6 col-sm-4">
                    <div class="service-card shadow-sm">
                        <i class="bi bi-house-heart"></i>
                        <p>Houses & Apartments</p>
                    </div>
                </div>
                <div class="col-6 col-sm-4">
                    <div class="service-card shadow-sm">
                        <i class="bi bi-briefcase"></i>
                        <p>Offices</p>
                    </div>
                </div>
                <div class="col-6 col-sm-4">
                    <div class="service-card shadow-sm">
                        <i class="bi bi-cone-striped"></i>
                        <p>Post Construction</p>
                    </div>
                </div>
                <div class="col-6 col-sm-4">
                    <div class="service-card shadow-sm">
                        <i class="bi bi-box-seam"></i>
                        <p>Move In/Out</p>
                    </div>
                </div>
                <div class="col-12 col-sm-8">
                    <div class="service-card shadow-sm">
                        <i class="bi bi-stars"></i>
                        <p>Basic & Deep Cleaning / General Remodeling</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="frequency-section mb-5">
            <h3 class="section-title">Frequency</h3>
            <div class="d-flex justify-content-center gap-2 mt-2">
                <span class="badge-custom">Weekly</span>
                <span class="badge-custom">Bi-Weekly</span>
                <span class="badge-custom">Monthly</span>
            </div>
        </div>

        <div class="d-grid gap-3">
            <a href="mailto:brillosupremecleaning@gmail.com" class="btn-custom shadow-sm">
                <i class="bi bi-envelope-at-fill"></i> Email
            </a>
            <a href="tel:+15203925723" class="btn-custom shadow-sm">
                <i class="bi bi-telephone-outbound-fill"></i> Phone Number
            </a>
            <a href="https://wa.me/qr/XKKVL7JZRDDLB1" class="btn-custom shadow-sm">
                <i class="bi bi-whatsapp"></i> WhatsApp
            </a>
        </div>

    </div>

    <img src="./assets/img/productos.png" alt="Products" class="click-icon">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
